version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    groups:
      ai-sdk-compatible:
        patterns:
          - ai
          - "@ai-sdk/*"
        update-types:
          - minor
          - patch
      workflow-compatible:
        patterns:
          - workflow
          - "@workflow/*"
        update-types:
          - minor
          - patch
      next-compatible:
        patterns:
          - next
          - eslint-config-next
        update-types:
          - minor
          - patch
      styling-compatible:
        patterns:
          - postcss
          - tailwindcss
          - "@tailwindcss/*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    groups:
      github-actions-compatible:
        patterns:
          - "*"
