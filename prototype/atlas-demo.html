<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atlas LMS — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400&family=Hanken+Grotesk:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
/* ===== shadcn-style tokens · warm "Quad" theme (stone base · pine primary · marigold accent) ===== */
:root{
  --background:39 38% 95%; --foreground:28 18% 14%;
  --card:40 50% 98%; --card-foreground:28 18% 14%;
  --popover:40 50% 98%; --popover-foreground:28 18% 14%;
  --muted:38 26% 90%; --muted-foreground:30 9% 40%;
  --primary:158 39% 22%; --primary-foreground:40 44% 96%;
  --secondary:38 32% 91%; --secondary-foreground:28 18% 18%;
  --accent:37 34% 88%; --accent-foreground:28 18% 16%;
  --destructive:12 62% 47%; --destructive-foreground:40 44% 96%;
  --border:34 20% 85%; --input:34 22% 83%; --ring:158 39% 30%;
  --radius:0.8rem;
  /* brand extras */
  --gold:36 86% 49%; --gold-foreground:30 45% 12%; --gold-soft:41 82% 90%;
  --clay:14 58% 49%; --clay-soft:16 64% 92%;
  --pine-soft:158 30% 91%;
  --ok:152 46% 34%; --ok-soft:150 42% 90%;
  --ease:cubic-bezier(.16,1,.3,1); --ease-in:cubic-bezier(.4,0,1,1);
  --sh-xs:0 1px 2px hsl(30 20% 20% / .06);
  --sh-sm:0 1px 2px hsl(30 20% 20% / .05), 0 1px 1px hsl(30 20% 20% / .04);
  --sh-md:0 2px 4px hsl(30 18% 18% / .05), 0 12px 28px -12px hsl(30 30% 20% / .20);
  --sh-lg:0 4px 8px hsl(30 18% 18% / .06), 0 24px 56px -20px hsl(30 30% 18% / .30);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Hanken Grotesk",system-ui,sans-serif;
  background:hsl(var(--background)); color:hsl(var(--foreground));
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
.display{font-family:"Fraunces",Georgia,serif; font-optical-sizing:auto; letter-spacing:-.012em; font-weight:480}
.mono{font-family:"Geist Mono",ui-monospace,monospace}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:hsl(30 14% 70% / .5);border-radius:99px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:hsl(30 14% 55% / .6);background-clip:padding-box}
::selection{background:hsl(var(--gold)/.28)}

/* ===== shadcn primitives ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:calc(var(--radius) - 2px);font-size:13.5px;font-weight:600;white-space:nowrap;transition:transform .16s var(--ease),background .16s var(--ease),box-shadow .16s var(--ease),color .16s var(--ease);border:1px solid transparent;outline:none}
.btn:focus-visible{box-shadow:0 0 0 2px hsl(var(--background)),0 0 0 4px hsl(var(--ring))}
.btn svg{width:16px;height:16px}
.btn:active{transform:translateY(.5px) scale(.99)}
.btn-primary{background:hsl(var(--primary));color:hsl(var(--primary-foreground));box-shadow:var(--sh-xs)}
.btn-primary:hover{background:hsl(158 39% 18%);box-shadow:var(--sh-sm);transform:translateY(-1px)}
.btn-gold{background:linear-gradient(135deg,hsl(36 88% 52%),hsl(30 84% 48%));color:hsl(var(--gold-foreground));box-shadow:0 4px 14px -6px hsl(var(--gold)/.7)}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 8px 20px -8px hsl(var(--gold)/.8);filter:saturate(1.05)}
.btn-secondary{background:hsl(var(--secondary));color:hsl(var(--secondary-foreground))}
.btn-secondary:hover{background:hsl(38 30% 87%)}
.btn-outline{background:hsl(var(--card));border-color:hsl(var(--border));color:hsl(var(--foreground))}
.btn-outline:hover{background:hsl(var(--accent));border-color:hsl(34 20% 78%)}
.btn-ghost{color:hsl(var(--foreground))}
.btn-ghost:hover{background:hsl(var(--accent))}
.btn-sm{height:32px;padding:0 12px;font-size:12.5px;border-radius:calc(var(--radius) - 4px);gap:6px}
.btn-sm svg{width:14px;height:14px}
.btn-icon{width:38px;height:38px;padding:0}
.card{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:var(--radius);box-shadow:var(--sh-sm)}
.sep{height:1px;background:hsl(var(--border));border:0}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:650;padding:3px 9px;border-radius:99px;border:1px solid hsl(var(--border));color:hsl(var(--foreground));line-height:1.3}
.badge svg{width:11px;height:11px}
.badge-pine{background:hsl(var(--pine-soft));color:hsl(158 44% 24%);border-color:transparent}
.badge-gold{background:hsl(var(--gold-soft));color:hsl(32 72% 32%);border-color:transparent}
.badge-clay{background:hsl(var(--clay-soft));color:hsl(14 58% 38%);border-color:transparent}
.badge-ok{background:hsl(var(--ok-soft));color:hsl(var(--ok));border-color:transparent}
.badge-outline{background:transparent}
.muted{color:hsl(var(--muted-foreground))}

/* ===== app shell ===== */
.app{display:grid;grid-template-columns:256px minmax(0,1fr) 400px;height:100vh;overflow:hidden;transition:grid-template-columns .42s var(--ease)}
.app.agent-collapsed{grid-template-columns:256px minmax(0,1fr) 0}

/* sidebar */
.sidebar{background:hsl(40 34% 93%);border-right:1px solid hsl(var(--border));display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:11px;padding:20px 18px 14px}
.brand .mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(150deg,hsl(158 40% 20%),hsl(158 38% 30%));display:grid;place-items:center;color:hsl(41 60% 90%);box-shadow:var(--sh-sm),inset 0 1px 0 hsl(40 60% 80%/.3);flex:none;cursor:pointer;transition:transform .3s var(--ease)}
.brand .mark:hover{transform:rotate(-8deg) scale(1.05)}
.brand .mark svg{width:19px;height:19px}
.brand .name{font-size:23px;line-height:1;letter-spacing:-.01em}
.brand .badge{margin-left:auto}
.persona{margin:4px 14px 12px;display:flex;background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:11px;padding:3px;gap:3px;position:relative}
.persona .glider{position:absolute;top:3px;bottom:3px;width:calc(50% - 4px);border-radius:8px;background:hsl(var(--primary));box-shadow:var(--sh-xs);transition:transform .4s var(--ease)}
.persona button{flex:1;z-index:1;font-size:12.5px;font-weight:600;color:hsl(var(--muted-foreground));padding:8px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:7px;transition:color .3s var(--ease)}
.persona button svg{width:14px;height:14px}
.persona button[aria-selected=true]{color:hsl(var(--primary-foreground))}
.nav{flex:1;overflow-y:auto;padding:4px 12px 12px}
.nav .group{margin-top:14px}
.nav .glabel{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:hsl(30 12% 56%);padding:6px 10px 5px;display:flex;gap:6px;align-items:center}
.nav .glabel .code{color:hsl(158 40% 30%)}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;color:hsl(28 14% 30%);font-weight:550;font-size:13.5px;cursor:pointer;transition:background .16s var(--ease),color .16s var(--ease);position:relative}
.nav a svg{width:16px;height:16px;color:hsl(30 12% 52%);flex:none;transition:color .16s,transform .26s var(--ease)}
.nav a .tail{margin-left:auto}
.nav a:hover{background:hsl(40 30% 88%);color:hsl(var(--foreground))}
.nav a:hover svg:first-child{color:hsl(var(--foreground));transform:translateX(1px)}
.nav a.active{background:hsl(var(--card));color:hsl(var(--foreground));font-weight:650;box-shadow:var(--sh-xs)}
.nav a.active svg:first-child{color:hsl(158 40% 26%)}
.nav a.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:hsl(var(--primary));animation:growbar .34s var(--ease)}
@keyframes growbar{from{transform:scaleY(0)}}
.side-foot{border-top:1px solid hsl(var(--border));padding:12px 14px;display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:99px;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;color:hsl(var(--primary-foreground))}
.side-foot .who{line-height:1.3;min-width:0}
.side-foot .who b{font-size:12.5px;font-weight:650;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot .who span{font-size:11px;color:hsl(var(--muted-foreground))}
.side-foot .cog{margin-left:auto;color:hsl(30 12% 52%);padding:6px;border-radius:8px;transition:.16s}
.side-foot .cog:hover{background:hsl(40 30% 88%);color:hsl(var(--foreground));transform:rotate(40deg)}

/* main */
.main{display:flex;flex-direction:column;min-width:0;background:hsl(var(--background))}
.topbar{height:56px;flex:none;display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid hsl(var(--border));background:hsl(var(--background)/.8);backdrop-filter:blur(10px);position:relative;z-index:5}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:hsl(var(--muted-foreground));min-width:0}
.crumb b{color:hsl(var(--foreground));font-weight:600}
.crumb svg{width:14px;height:14px;opacity:.5}
.crumb .here{animation:fadeSlide .3s var(--ease)}
.cmdk{display:flex;align-items:center;gap:9px;height:36px;padding:0 10px 0 12px;border:1px solid hsl(var(--border));border-radius:10px;background:hsl(var(--card));color:hsl(var(--muted-foreground));font-size:12.5px;min-width:248px;transition:.18s var(--ease)}
.cmdk:hover{border-color:hsl(34 20% 74%);box-shadow:var(--sh-sm)}
.cmdk svg{width:14px;height:14px}
.cmdk .kbd{margin-left:auto;font-size:11px;font-weight:600;color:hsl(30 12% 55%);background:hsl(var(--muted));border-radius:6px;padding:2px 6px}
.tbtn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:hsl(28 14% 30%);transition:.16s;position:relative}
.tbtn:hover{background:hsl(var(--accent))}
.tbtn svg{width:18px;height:18px}
.tbtn .dotn{position:absolute;top:8px;right:9px;width:6px;height:6px;border-radius:99px;background:hsl(var(--clay))}
.screen{flex:1;overflow-y:auto;position:relative}
.wrap{max-width:940px;margin:0 auto;padding:32px 32px 96px}
.view{animation:viewIn .42s var(--ease)}
.view.from-right{animation:slideR .42s var(--ease)}
.view.from-left{animation:slideL .42s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}}
@keyframes slideR{from{opacity:0;transform:translateX(26px)}}
@keyframes slideL{from{opacity:0;transform:translateX(-26px)}}
@keyframes fadeSlide{from{opacity:0;transform:translateY(-4px)}}

/* page head */
.phead{margin-bottom:24px}
.phead .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:hsl(158 40% 30%);margin-bottom:9px;display:flex;align-items:center;gap:7px}
.phead h1{font-size:36px;line-height:1.08;letter-spacing:-.015em}
.phead p{color:hsl(var(--muted-foreground));margin-top:9px;font-size:15px;max-width:60ch;line-height:1.55}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.tile{padding:15px 16px;position:relative;overflow:hidden}
.tile .k{font-size:11.5px;color:hsl(var(--muted-foreground));font-weight:600;display:flex;align-items:center;gap:6px}
.tile .k svg{width:14px;height:14px;color:hsl(30 12% 55%)}
.tile .v{font-size:27px;font-weight:700;letter-spacing:-.02em;margin-top:8px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:13px;font-weight:600;color:hsl(var(--muted-foreground))}

/* attention cards */
.att{display:flex;gap:13px;padding:15px;align-items:flex-start;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.att+.att{margin-top:11px}
.att:hover{box-shadow:var(--sh-md);transform:translateY(-2px)}
.att .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.att .ic svg{width:18px;height:18px}
.att .bd{flex:1;min-width:0}
.att .bd h4{font-size:14.5px;font-weight:650}
.att .bd p{font-size:13px;color:hsl(var(--muted-foreground));margin-top:3px;line-height:1.5}
.att .act{display:flex;gap:8px;margin-top:12px}

.sectlabel{display:flex;align-items:center;gap:10px;margin:24px 0 12px;font-size:13px;font-weight:650}
.sectlabel .ln{flex:1;height:1px;background:hsl(var(--border))}
.sectlabel .ct{font-size:11px;color:hsl(30 12% 56%);font-weight:600}

/* agent panel */
.agent{background:linear-gradient(180deg,hsl(41 44% 96%),hsl(40 38% 94%));border-left:1px solid hsl(var(--border));display:flex;flex-direction:column;min-width:0;overflow:hidden}
.agent-head{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid hsl(var(--border))}
.agent-orb{width:28px;height:28px;border-radius:9px;background:linear-gradient(145deg,hsl(36 88% 52%),hsl(28 80% 46%));display:grid;place-items:center;color:hsl(40 60% 97%);box-shadow:0 4px 12px -4px hsl(var(--gold)/.7);flex:none;position:relative}
.agent-orb svg{width:16px;height:16px}
.agent.busy .agent-orb::after{content:"";position:absolute;inset:-4px;border-radius:12px;border:2px solid hsl(var(--gold)/.5);animation:halo 1.2s var(--ease) infinite}
@keyframes halo{to{inset:-9px;opacity:0}}
.agent-head .t b{font-size:13.5px;font-weight:700}
.agent-head .t span{font-size:11px;color:hsl(var(--muted-foreground));display:flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:99px;background:hsl(var(--ok));box-shadow:0 0 0 3px hsl(var(--ok)/.18)}
.dot.busy{background:hsl(var(--gold));box-shadow:0 0 0 3px hsl(var(--gold)/.2);animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.45}}
.agent-head .min{margin-left:auto;color:hsl(30 12% 52%);padding:6px;border-radius:8px;transition:.16s}
.agent-head .min:hover{background:hsl(var(--accent))}
.agent-head .min svg{width:18px;height:18px;transition:transform .3s var(--ease)}
.agent-head .stop{margin-left:auto;display:none;align-items:center;gap:6px;font-size:12px;font-weight:600;color:hsl(var(--destructive));background:hsl(var(--destructive)/.1);border-radius:8px;padding:7px 11px;transition:.16s}
.agent-head .stop:hover{background:hsl(var(--destructive)/.16)}
.agent-head .stop svg{width:13px;height:13px}
.agent.busy .stop{display:inline-flex}.agent.busy .min{display:none}
.agent-body{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:13px}
.goal{border:1px solid hsl(var(--gold)/.3);background:linear-gradient(180deg,hsl(var(--gold-soft)/.7),hsl(var(--gold-soft)/.35));border-radius:13px;padding:12px 13px}
.goal .gl{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:hsl(32 70% 36%);display:flex;align-items:center;gap:6px}
.goal .gl svg{width:12px;height:12px}
.goal .gt{font-size:13.5px;font-weight:600;margin-top:6px;line-height:1.4}
.goal .gs{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:11.5px;color:hsl(var(--muted-foreground))}
.msg{display:flex;gap:10px;animation:msgIn .4s var(--ease)}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}}
.msg .who{width:25px;height:25px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:10px;font-weight:700}
.msg.me .who{background:hsl(var(--secondary));border:1px solid hsl(var(--border));color:hsl(var(--secondary-foreground))}
.msg.ai .who{background:linear-gradient(145deg,hsl(36 88% 52%),hsl(28 80% 46%));color:#fff}
.msg .bubble{font-size:13.5px;line-height:1.6;color:hsl(28 14% 26%);padding-top:2px}
.msg.me .bubble{color:hsl(var(--foreground));font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:6px 10px;border-radius:99px;border:1px dashed hsl(var(--gold)/.45);background:hsl(var(--gold-soft)/.5);color:hsl(32 64% 34%);opacity:0;transform:translateY(5px) scale(.96);animation:chipIn .4s var(--ease) forwards}
.chip svg{width:12px;height:12px}
.chip.solid{border-style:solid;cursor:pointer;transition:transform .16s var(--ease),background .16s}
.chip.solid:hover{transform:translateY(-1px);background:hsl(var(--gold-soft)/.8)}
.chip .x{opacity:.45;transition:.16s}.chip.solid:hover .x{opacity:.9}
@keyframes chipIn{to{opacity:1;transform:none}}
.tool{display:flex;align-items:center;gap:10px;font-size:12.5px;border:1px solid hsl(var(--border));background:hsl(var(--card));border-radius:11px;padding:10px 12px;opacity:0;transform:translateY(5px);animation:chipIn .34s var(--ease) forwards}
.tool .ti{width:23px;height:23px;border-radius:7px;background:hsl(var(--gold-soft));display:grid;place-items:center;flex:none}
.tool .ti svg{width:13px;height:13px;color:hsl(32 70% 38%)}
.tool .tt{flex:1;color:hsl(28 14% 28%)}.tool .tt b{font-weight:650;color:hsl(var(--foreground))}
.tool .spin{width:14px;height:14px;border:2px solid hsl(var(--gold)/.3);border-top-color:hsl(var(--gold));border-radius:99px;animation:sp .7s linear infinite}
.tool .chk{color:hsl(var(--ok));animation:pop .3s var(--ease)}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(0)}}
.reason{border:1px solid hsl(var(--border));border-radius:11px;background:hsl(var(--card));overflow:hidden}
.reason summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:9px;padding:10px 12px;font-size:12px;color:hsl(var(--muted-foreground));font-weight:600}
.reason summary::-webkit-details-marker{display:none}
.reason summary .caret{width:13px;height:13px;transition:transform .28s var(--ease)}
.reason[open] summary .caret{transform:rotate(90deg)}
.reason .rb{padding:0 13px 12px 32px;font-size:12px;color:hsl(var(--muted-foreground));line-height:1.65;animation:fadeSlide .3s var(--ease)}
.agent-foot{flex:none;border-top:1px solid hsl(var(--border));padding:12px}
.composer{border:1px solid hsl(var(--border));border-radius:13px;background:hsl(var(--card));padding:8px 8px 8px 13px;display:flex;align-items:flex-end;gap:8px;box-shadow:var(--sh-xs);transition:.18s var(--ease)}
.composer:focus-within{border-color:hsl(var(--gold)/.5);box-shadow:0 0 0 3px hsl(var(--gold)/.14)}
.composer textarea{flex:1;border:0;outline:0;resize:none;font:inherit;font-size:13.5px;background:none;max-height:90px;line-height:1.5;padding:5px 0;color:hsl(var(--foreground))}
.composer .send{width:33px;height:33px;border-radius:9px;background:hsl(var(--primary));color:hsl(var(--primary-foreground));display:grid;place-items:center;flex:none;transition:.16s var(--ease)}
.composer .send:hover{background:linear-gradient(135deg,hsl(36 88% 52%),hsl(28 80% 46%));transform:rotate(-8deg)}
.composer .send svg{width:15px;height:15px}
.auto{display:flex;align-items:center;gap:8px;margin-top:10px;padding:0 3px;font-size:11px;color:hsl(var(--muted-foreground))}
.auto .track{margin-left:auto;display:flex;background:hsl(var(--muted));border-radius:99px;padding:2px;position:relative}
.auto .track .glider2{position:absolute;top:2px;bottom:2px;border-radius:99px;background:hsl(var(--card));box-shadow:var(--sh-xs);transition:.36s var(--ease)}
.auto .track button{position:relative;z-index:1;font-size:10.5px;font-weight:650;color:hsl(var(--muted-foreground));padding:4px 9px;border-radius:99px;transition:color .3s}
.auto .track button[aria-selected=true]{color:hsl(var(--foreground))}

/* proposal bar (shared element) */
.proposal-bar{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:13px;padding:12px 15px;border:1px solid hsl(var(--gold)/.4);background:linear-gradient(180deg,hsl(var(--card)),hsl(var(--gold-soft)/.4));border-radius:var(--radius);box-shadow:var(--sh-md);margin-bottom:18px}
.proposal-bar.published{border-color:hsl(var(--ok)/.4);background:linear-gradient(180deg,hsl(var(--card)),hsl(var(--ok-soft)/.5))}
.proposal-bar .tag{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:hsl(32 70% 34%);background:hsl(var(--gold-soft));padding:5px 10px;border-radius:8px;border:1px solid hsl(var(--gold)/.3);display:inline-flex;align-items:center;gap:5px}
.proposal-bar .tag svg{width:12px;height:12px}
.proposal-bar.published .tag{color:hsl(var(--ok));background:hsl(var(--ok-soft));border-color:transparent}
.proposal-bar .diff{font-size:12.5px;color:hsl(var(--muted-foreground));font-variant-numeric:tabular-nums}
.proposal-bar .diff b{color:hsl(var(--ok));font-weight:700}
.proposal-bar .sp{flex:1}

.obj{display:flex;gap:12px;padding:14px 15px;align-items:flex-start}
.obj+.obj,.modrow+.modrow{margin-top:10px}
.obj .lo{font-size:11px;font-weight:700;color:hsl(158 42% 26%);background:hsl(var(--pine-soft));border-radius:7px;padding:4px 8px;flex:none}
.obj .ob h4{font-size:13.5px;font-weight:600;line-height:1.4}
.obj .ob .bloom{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.modrow{display:flex;align-items:center;gap:13px;padding:13px 15px}
.modrow .num{width:27px;height:27px;border-radius:8px;background:hsl(var(--secondary));border:1px solid hsl(var(--border));display:grid;place-items:center;font-size:12px;font-weight:700;color:hsl(var(--secondary-foreground));flex:none;font-variant-numeric:tabular-nums}
.modrow .mt{flex:1;min-width:0}.modrow .mt b{font-size:13.5px;font-weight:600}.modrow .mt p{font-size:12px;color:hsl(var(--muted-foreground));margin-top:1px}
.stagger{opacity:0;transform:translateY(9px);animation:chipIn .46s var(--ease) forwards}

/* coverage / tutor */
.cov{display:flex;gap:24px;align-items:center}
.ring{width:132px;height:132px;border-radius:99px;flex:none;display:grid;place-items:center;position:relative;background:conic-gradient(hsl(var(--gold)) 0%, hsl(var(--muted)) 0)}
.ring::after{content:"";position:absolute;inset:12px;background:hsl(var(--card));border-radius:99px;box-shadow:inset 0 1px 3px hsl(30 20% 20%/.07)}
.ring .rv{position:relative;z-index:1;text-align:center}
.ring .rv b{font-size:32px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ring .rv span{font-size:10px;color:hsl(var(--muted-foreground));font-weight:700;display:block;text-transform:uppercase;letter-spacing:.06em;margin-top:1px}
.cbar+.cbar{margin-top:13px}
.cbar .cl{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:6px}
.cbar .cl .lo{font-size:10px;font-weight:700;color:hsl(158 42% 26%);background:hsl(var(--pine-soft));padding:2px 6px;border-radius:5px}
.cbar .cl .pct{margin-left:auto;font-weight:650;font-variant-numeric:tabular-nums}
.cbar .tr{height:9px;border-radius:99px;background:hsl(var(--muted));overflow:hidden}
.cbar .fl{height:100%;border-radius:99px;background:linear-gradient(90deg,hsl(158 40% 30%),hsl(158 44% 24%));width:0;transition:width 1.1s var(--ease)}
.cbar.gap .fl{background:linear-gradient(90deg,hsl(36 86% 52%),hsl(var(--clay)))}
.cite{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:650;color:hsl(158 42% 28%);background:hsl(var(--pine-soft));border-radius:6px;padding:3px 8px;cursor:pointer;transition:.16s}
.cite svg{width:11px;height:11px}
.cite:hover{background:hsl(158 32% 86%);transform:translateY(-1px)}

/* empty state */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 24px}
.empty .ill{width:84px;height:84px;border-radius:24px;background:linear-gradient(150deg,hsl(var(--pine-soft)),hsl(var(--gold-soft)));display:grid;place-items:center;color:hsl(158 40% 28%);box-shadow:var(--sh-sm);animation:float 3.4s var(--ease) infinite}
.empty .ill svg{width:36px;height:36px}
@keyframes float{50%{transform:translateY(-9px)}}
.empty h3{font-size:17px;font-weight:650;margin-top:18px}
.empty p{color:hsl(var(--muted-foreground));margin-top:6px;max-width:42ch;font-size:13.5px;line-height:1.55}
.point{display:inline-flex;align-items:center;gap:7px;margin-top:16px;font-size:13px;font-weight:600;color:hsl(32 64% 34%)}
.point svg{width:15px;height:15px;animation:nudge 1.5s var(--ease) infinite}
@keyframes nudge{50%{transform:translateX(5px)}}

/* sheet / tray */
.scrim{position:fixed;inset:0;background:hsl(28 20% 14%/.42);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .34s var(--ease);z-index:40}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:min(520px,94vw);background:hsl(var(--popover));border:1px solid hsl(var(--border));border-bottom:0;border-radius:20px 20px 0 0;box-shadow:var(--sh-lg);z-index:41;transition:transform .44s var(--ease);padding:8px 22px 24px}
.sheet.show{transform:translate(-50%,0)}
.sheet .grip{width:38px;height:4px;border-radius:99px;background:hsl(var(--border));margin:8px auto 14px}
.sheet h3{font-size:18px;font-weight:650;display:flex;align-items:center;gap:9px}
.sheet .x{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:hsl(var(--muted-foreground))}
.sheet .x:hover{background:hsl(var(--accent))}
.sheet .x svg{width:16px;height:16px}

/* command palette */
.cmd-overlay{position:fixed;inset:0;background:hsl(28 20% 14%/.4);backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:flex-start;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s var(--ease)}
.cmd-overlay.show{opacity:1;pointer-events:auto}
.cmd{width:min(640px,92vw);margin-top:12vh;background:hsl(var(--popover));border:1px solid hsl(var(--border));border-radius:16px;box-shadow:var(--sh-lg);overflow:hidden;transform:translateY(-12px) scale(.97);transition:transform .26s var(--ease)}
.cmd-overlay.show .cmd{transform:none}
.cmd .ci{display:flex;align-items:center;gap:11px;padding:16px 18px;border-bottom:1px solid hsl(var(--border))}
.cmd .ci svg{width:18px;height:18px;color:hsl(var(--gold))}
.cmd .ci input{flex:1;border:0;outline:0;font:inherit;font-size:15px;background:none;color:hsl(var(--foreground))}
.cmd .grp{padding:8px}
.cmd .gh{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:hsl(30 12% 56%);padding:8px 10px 5px}
.cmd .opt{display:flex;align-items:center;gap:12px;padding:11px;border-radius:10px;cursor:pointer;font-size:13.5px;transition:background .14s}
.cmd .opt:hover{background:hsl(var(--gold-soft)/.6)}
.cmd .opt svg{width:16px;height:16px;color:hsl(var(--muted-foreground))}
.cmd .opt:hover svg{color:hsl(32 70% 40%)}
.cmd .opt .k{margin-left:auto;font-size:11px;color:hsl(30 12% 58%)}

@media(max-width:1200px){.app{grid-template-columns:220px minmax(0,1fr) 364px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark" id="logoEgg" title="Atlas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 16 9 5 9-5M3 12l9 5 9-5"/></svg></div>
      <div class="name display">Atlas</div>
      <span class="badge badge-outline">DEMO</span>
    </div>
    <div class="persona" id="persona"></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sidefoot"></div>
  </aside>

  <section class="main">
    <header class="topbar">
      <div class="crumb" id="crumb"></div>
      <div style="flex:1"></div>
      <button class="cmdk" id="cmdkBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>Ask Atlas or search<span class="kbd">⌘K</span></button>
      <button class="tbtn" id="bell" title="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="dotn"></span></button>
    </header>
    <div class="screen" id="screen"></div>
  </section>

  <aside class="agent" id="agentPanel">
    <div class="agent-head">
      <div class="agent-orb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 1.9 4.6L18.5 9l-4.6 1.9L12 15l-1.9-4.1L5.5 9l4.6-1.4Z"/></svg></div>
      <div class="t"><b>Atlas</b><span id="agentStatus"><span class="dot"></span> Ready</span></div>
      <button class="min" id="agentMin" title="Collapse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
      <button class="stop" id="agentStop"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>Stop</button>
    </div>
    <div class="agent-body" id="agentBody"></div>
    <div class="agent-foot">
      <div class="composer"><textarea id="composer" rows="1" placeholder="Message Atlas…"></textarea><button class="send" id="composerSend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button></div>
      <div class="auto"><span>Autonomy</span><div class="track" id="autonomy"><div class="glider2"></div><button data-a="ask" aria-selected="true">Approve each</button><button data-a="auto">Auto + review</button><button data-a="run">Run</button></div></div>
    </div>
  </aside>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>

<div class="cmd-overlay" id="cmdOverlay">
  <div class="cmd">
    <div class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 1.9 4.6L18.5 9l-4.6 1.9L12 15l-1.9-4.1L5.5 9l4.6-1.4Z"/></svg><input id="cmdInput" placeholder="Ask Atlas to do something, or jump to…" /></div>
    <div id="cmdList"></div>
  </div>
</div>

<script>
/* ---------- lucide-style icons ---------- */
const I={
 today:'<path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/>',
 book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>',
 cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
 inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.5 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.5A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.5Z"/>',
 layers:'<path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 17l9 5 9-5"/>',
 task:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
 grade:'<path d="M3 3v18h18"/><rect x="7" y="11" width="3" height="6" rx="1"/><rect x="12" y="7" width="3" height="10" rx="1"/><rect x="17" y="13" width="3" height="4" rx="1"/>',
 target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
 chart:'<path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/>',
 tutor:'<path d="m12 3 1.9 4.6L18.5 9l-4.6 1.9L12 15l-1.9-4.1L5.5 9l4.6-1.4Z"/>',
 cap:'<path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>',
 spark:'<path d="m12 3 1.9 4.6L18.5 9l-4.6 1.9L12 15l-1.9-4.1L5.5 9l4.6-1.4Z"/>',
 wand:'<path d="m15 4 5 5L8 21l-5 1 1-5Z"/><path d="m14 5 5 5"/>',
 cog:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-2.82 1.17 2 2 0 0 1-4 0 1.65 1.65 0 0 0-2.82-1.17l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.5 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.27.6.86 1 1.5 1H21a2 2 0 0 1 0 4h-.09c-.64 0-1.23.4-1.5 1Z"/>',
 warn:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 check:'<path d="M20 6 9 17l-5-5"/>',
 doc:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M9 13h6M9 17h4"/>',
 chev:'<path d="m9 6 6 6-6 6"/>', x:'<path d="M18 6 6 18M6 6l12 12"/>', send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
 ann:'<path d="m3 11 18-5v12L3 14v-3Z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>', users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/>',
};
const svg=(p,w)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||2}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const $=(s,r=document)=>r.querySelector(s);
const el=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild;};

/* ---------- data ---------- */
const NAV={
 professor:[
  {g:'Workspace',items:[['today','Today',I.today],['courses','Courses',I.book],['calendar','Calendar',I.cal],['inbox','Inbox',I.inbox]]},
  {g:'course',items:[['authoring','Course Builder',I.wand,'ai'],['modules','Modules',I.layers],['assignments','Assignments',I.task],['gradebook','Gradebook',I.grade,'pip'],['outcomes','Outcomes',I.target],['analytics','Analytics',I.chart]]},
 ],
 student:[
  {g:'Workspace',items:[['today','Today',I.today],['courses','Courses',I.book],['calendar','Calendar',I.cal],['inbox','Inbox',I.inbox]]},
  {g:'course',items:[['home','Course Home',I.book],['modules','Modules',I.layers],['assignments','Assignments',I.task],['grades','Grades',I.grade],['tutor','Atlas Tutor',I.tutor,'ai']]},
 ],
};
const ORDER={professor:['today','courses','calendar','inbox','authoring','modules','assignments','gradebook','outcomes','analytics'],student:['today','courses','calendar','inbox','home','modules','assignments','grades','tutor']};
const PERSONAS=[['professor','Professor',I.cap],['student','Student',I.book]];
const USER={professor:{n:'Dr. Elena Reyes',r:'Instructor · Statistics',i:'ER',c:'linear-gradient(135deg,hsl(158 38% 30%),hsl(158 40% 22%))'},student:{n:'Maya Patel',r:'Student · B+ average',i:'MP',c:'linear-gradient(135deg,hsl(36 80% 50%),hsl(28 78% 46%))'}};
const TITLES={today:'Today',courses:'Courses',calendar:'Calendar',inbox:'Inbox',authoring:'Course Builder',modules:'Modules',assignments:'Assignments',gradebook:'Gradebook',outcomes:'Outcomes',analytics:'Analytics',home:'Course Home',grades:'Grades',tutor:'Atlas Tutor'};

let S={persona:'professor',view:'today',prevIdx:0,authored:false,running:false};

/* ---------- chrome ---------- */
function renderPersona(){
 const p=$('#persona');p.innerHTML='<div class="glider"></div>';
 PERSONAS.forEach(([id,label,ic])=>{
  const b=el(`<button aria-selected="${S.persona===id}">${svg(ic)} ${label}</button>`);
  b.onclick=()=>{if(S.persona===id)return;S.persona=id;S.view='today';S.prevIdx=0;render();};
  p.appendChild(b);
 });
 $('#persona .glider').style.transform=`translateX(${S.persona==='professor'?0:'100%'})`;
}
function renderNav(){
 const n=$('#nav');n.innerHTML='';
 NAV[S.persona].forEach(grp=>{
  const g=el(`<div class="group"></div>`);
  g.appendChild(el(`<div class="glabel">${grp.g==='course'?'<span class="code">STAT-201</span> · Applied Statistics':grp.g}</div>`));
  grp.items.forEach(([id,label,ic,tail])=>{
   const t=tail==='ai'?`<span class="badge badge-gold tail">AI</span>`:tail==='pip'?`<span class="badge badge-clay tail">3</span>`:'';
   const a=el(`<a class="${S.view===id?'active':''}">${svg(ic)}<span>${label}</span>${t}</a>`);
   a.onclick=()=>setView(id);
   g.appendChild(a);
  });
  n.appendChild(g);
 });
}
function renderFoot(){const u=USER[S.persona];$('#sidefoot').innerHTML=`<div class="avatar" style="background:${u.c}">${u.i}</div><div class="who"><b>${u.n}</b><span>${u.r}</span></div><button class="cog">${svg(I.cog)}</button>`;}
function renderCrumb(){
 const inCourse=!['today','courses','calendar','inbox'].includes(S.view);
 $('#crumb').innerHTML=`${svg(I.cap)}<span>${S.persona==='professor'?'Teaching':'Learning'}</span>${inCourse?`${svg(I.chev)}<b>STAT-201</b>`:''}${svg(I.chev)}<b class="here">${TITLES[S.view]}</b>`;
}
function setView(v){
 if(v===S.view)return;
 const a=ORDER[S.persona].indexOf(S.view),b=ORDER[S.persona].indexOf(v);
 S.prevIdx=a;S.dir=b>a?'right':'left';S.view=v;render();
}
function render(){renderPersona();renderNav();renderFoot();renderCrumb();renderScreen();renderAgent();}

/* ---------- sheet / tray (gradual revelation) ---------- */
function openSheet(html,h){const s=$('#sheet');s.style.height=h||'auto';s.innerHTML=`<div class="grip"></div><button class="x" onclick="closeSheet()">${svg(I.x)}</button>`+html;$('#scrim').classList.add('show');requestAnimationFrame(()=>s.classList.add('show'));}
function closeSheet(){$('#sheet').classList.remove('show');$('#scrim').classList.remove('show');}

/* ---------- command palette ---------- */
const CMDS=[
 {g:'Ask Atlas',o:[['Draft a full course from a description',I.wand,()=>{go('authoring',true)}],['Find students falling behind',I.warn,()=>go('gradebook')],['Explain a concept from my course',I.tutor,()=>{S.persona='student';go('tutor')}]]},
 {g:'Navigate',o:[['Today',I.today,()=>go('today')],['Course Builder',I.wand,()=>go('authoring')],['Gradebook',I.grade,()=>go('gradebook')],['Outcomes',I.target,()=>go('outcomes')]]},
];
function go(v,run){closeCmd();if(S.persona==='student'&&!ORDER.student.includes(v))S.persona='professor';setView(v);if(run)setTimeout(runAuthoring,520);}
function openCmd(){$('#cmdOverlay').classList.add('show');$('#cmdInput').value='';setTimeout(()=>$('#cmdInput').focus(),60);}
function closeCmd(){$('#cmdOverlay').classList.remove('show');}
function renderCmd(){const l=$('#cmdList');l.innerHTML='';CMDS.forEach(grp=>{const d=el(`<div class="grp"><div class="gh">${grp.g}</div></div>`);grp.o.forEach(([label,ic,fn])=>{const o=el(`<div class="opt">${svg(ic)}<span>${label}</span><span class="k">↵</span></div>`);o.onclick=fn;d.appendChild(o);});l.appendChild(d);});}

/* ---------- wiring ---------- */
function moveAutoGlider(){const tr=$('#autonomy');const sel=tr.querySelector('button[aria-selected=true]');const g=tr.querySelector('.glider2');g.style.left=sel.offsetLeft+'px';g.style.width=sel.offsetWidth+'px';}
function wire(){
 $('#cmdkBtn').onclick=openCmd;
 $('#cmdOverlay').onclick=e=>{if(e.target.id==='cmdOverlay')closeCmd();};
 $('#scrim').onclick=closeSheet;
 document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCmd();}if(e.key==='Escape'){closeCmd();closeSheet();}});
 $('#agentMin').onclick=()=>{const a=$('#app');a.classList.toggle('agent-collapsed');$('#agentMin').querySelector('svg').style.transform=a.classList.contains('agent-collapsed')?'rotate(180deg)':'';};
 const tr=$('#autonomy');tr.querySelectorAll('button').forEach(b=>b.onclick=()=>{tr.querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected',x===b));moveAutoGlider();});
 const c=$('#composer');c.oninput=()=>{c.style.height='auto';c.style.height=Math.min(c.scrollHeight,90)+'px';};
 $('#logoEgg').onclick=easterEgg;
 $('#bell').onclick=()=>go('today');

/* ---------- delight helpers ---------- */
function animateNum(elm,to,dur=950){let t0;const f=ts=>{if(!t0)t0=ts;const p=Math.min((ts-t0)/dur,1);const e=1-Math.pow(1-p,3);elm.textContent=Math.round(to*e).toLocaleString();if(p<1)requestAnimationFrame(f);};requestAnimationFrame(f);}
function burst(x,y){if(!window.confetti)return;window.confetti({particleCount:90,spread:70,startVelocity:42,origin:{x,y},colors:['#E5912B','#22503F','#C2552F','#F0B45A','#2F8F5B'],scalar:.95,ticks:160});}
function celebrate(){if(!window.confetti)return;const o={colors:['#E5912B','#22503F','#C2552F','#F0B45A','#2F8F5B']};window.confetti({...o,particleCount:120,spread:75,origin:{y:.32},startVelocity:48});setTimeout(()=>window.confetti({...o,particleCount:60,angle:60,spread:60,origin:{x:0,y:.5}}),140);setTimeout(()=>window.confetti({...o,particleCount:60,angle:120,spread:60,origin:{x:1,y:.5}}),140);}
function morphText(btn,txt){const s=btn.querySelector('.lbl');if(!s){btn.textContent=txt;return;}s.style.transition='opacity .16s var(--ease-in),transform .16s var(--ease-in)';s.style.opacity=0;s.style.transform='translateY(-4px)';setTimeout(()=>{s.textContent=txt;s.style.transition='opacity .26s var(--ease),transform .26s var(--ease)';s.style.opacity=1;s.style.transform='none';},170);}
function easterEgg(){const m=$('#logoEgg');m.animate([{transform:'rotate(0) scale(1)'},{transform:'rotate(-18deg) scale(1.18)'},{transform:'rotate(360deg) scale(1)'}],{duration:700,easing:'cubic-bezier(.16,1,.3,1)'});const r=m.getBoundingClientRect();burst((r.left+r.width/2)/innerWidth,(r.top+r.height/2)/innerHeight);}

const OBJS=[['LO1','Summarize and visualize data with descriptive statistics','Understand'],['LO2','Apply hypothesis testing to draw inferences from a sample','Apply'],['LO3','Model relationships between variables using regression','Analyze'],['LO4','Evaluate statistical claims and communicate findings','Evaluate'],['LO5','Design a study and defend its methodology','Create']];
const MODS=[['Foundations & Data','Types, sampling, visualization','LO1'],['Descriptive Statistics','Center, spread, distributions','LO1'],['Probability','Rules, distributions, the normal model','LO1 · LO2'],['Sampling Distributions','CLT, standard error','LO2'],['Confidence Intervals','Estimation, margin of error','LO2'],['Hypothesis Testing','Null/alternative, p-values, errors','LO2 · LO4']];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function runAuthoring(){
 if(S.running)return;S.running=true;
 const btn=$('#runBtn');btn.disabled=true;btn.style.opacity=.85;morphText(btn,'Drafting…');
 $('#agentPanel').classList.add('busy');$('#agentStatus').innerHTML='<span class="dot busy"></span> Working…';
 const run=$('#agentRun'),art=$('#artifact');run.innerHTML='';
 run.insertAdjacentHTML('beforeend',`<div class="chips">${['Objectives','Module map','Assessments','Alignment'].map((c,i)=>`<span class="chip" style="animation-delay:${i*.08}s">${svg(I.target)} ${c} <span class="x">×</span></span>`).join('')}</div>`);
 await sleep(680);
 art.innerHTML=`<div class="sectlabel" style="margin-top:26px">Proposed course <span class="ln"></span><span class="ct" id="streamCt">streaming…</span></div><div id="objWrap"></div>`;
 const tools=['Analyzing brief & 5 program outcomes','Drafting 5 learning objectives','Mapping 14 weekly modules','Designing 2 midterms + final project','Aligning every item to an objective'];
 for(let i=0;i<tools.length;i++){
  const c=el(toolCard(tools[i],0));run.appendChild(c);await sleep(600);
  c.querySelector('.spin').replaceWith(el(`<span class="chk">${svg(I.check)}</span>`));
  if(i===1){const w=$('#objWrap');for(const[lo,d,bl]of OBJS){w.appendChild(el(`<div class="card obj stagger" style="margin-bottom:10px"><span class="lo">${lo}</span><div class="ob"><h4>${d}</h4><div class="bloom"><span class="badge badge-pine">Bloom · ${bl}</span><span class="badge badge-gold">${svg(I.spark)} drafted</span></div></div></div>`));await sleep(170);}}
  if(i===2){art.insertAdjacentHTML('beforeend',`<div class="sectlabel">Module map <span class="ln"></span><span class="ct">14 weeks · 6 shown</span></div><div id="modWrap"></div>`);const w=$('#modWrap');for(let m=0;m<MODS.length;m++){const[t,d,lo]=MODS[m];w.appendChild(el(`<div class="card modrow stagger" style="margin-bottom:9px"><div class="num">${m+1}</div><div class="mt"><b>${t}</b><p>${d}</p></div><span class="badge badge-pine">${lo}</span></div>`));await sleep(140);}}
  if(i===3){art.insertAdjacentHTML('beforeend',`<div class="sectlabel">Assessments <span class="ln"></span></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">${[['Midterm 1','Wk 7 · LO1–LO2'],['Midterm 2','Wk 12 · LO2–LO4'],['Final Project','Wk 14 · LO5']].map((a,j)=>`<div class="card stagger" style="padding:15px;animation-delay:${j*.1}s"><b style="font-size:13.5px">${a[0]}</b><p class="muted" style="font-size:12px;margin-top:3px">${a[1]}</p></div>`).join('')}</div>`);}
 }
 run.insertAdjacentHTML('beforeend',`<div class="reason"><details><summary>${svg(I.chev,2.2).replace('<svg','<svg class="caret"')} Why this structure</summary><div class="rb">Descriptive stats are front-loaded to build intuition before inference. Hypothesis testing (LO4) spans Wks 6 & 11 — your stated emphasis and historically the hardest objective. The two midterms bracket the inference unit so struggling students surface before the final.</div></details></div>`);
 $('#agentStatus').innerHTML='<span class="dot"></span> Proposal ready';$('#agentPanel').classList.remove('busy');
 $('#streamCt').textContent='complete';
 const bar=el(`<div class="proposal-bar" id="propBar" style="opacity:0;transform:translateY(-10px)"><span class="tag">${svg(I.spark)} Draft · not created</span><span class="diff"><b>+5</b> objectives · <b>+14</b> modules · <b>+3</b> assessments</span><span class="sp"></span><button class="btn btn-ghost btn-sm" onclick="S.running=false;runAuthoring()">Regenerate</button><button class="btn btn-outline btn-sm">Edit</button><button class="btn btn-gold btn-sm" id="approveCourse">${svg(I.check)} Approve & create</button></div>`);
 art.insertBefore(bar,art.firstChild);
 bar.animate([{opacity:0,transform:'translateY(-10px)'},{opacity:1,transform:'none'}],{duration:420,easing:'cubic-bezier(.16,1,.3,1)',fill:'forwards'});
 bar.scrollIntoView({behavior:'smooth',block:'start'});
 morphText(btn,'Drafted ✓');
 $('#approveCourse').onclick=confirmCreate;
 S.running=false;S.authored=true;
}

 setTimeout(()=>{const d=$('#doPost');if(d)d.onclick=()=>{closeSheet();setTimeout(()=>{const st=$('#postState');if(st)st.innerHTML='<span class="badge badge-ok">'+svg(I.check)+' Posted to 18</span>';const pb=$('#postBtn');if(pb){pb.outerHTML='<span class="badge badge-ok" style="padding:7px 12px">'+svg(I.check)+' Posted</span>';}burst(.5,.4);},260);};},40);

function openNudges(){openSheet(`<h3>${svg(I.spark)} 3 nudges, drafted</h3><p class="muted" style="margin-top:8px;font-size:13px">Personal to each student — draft, not sent.</p>
 <div style="margin-top:14px;display:flex;flex-direction:column;gap:10px">${['Maya — "Saw you aced descriptive stats. Hypothesis testing is next + heavily tested — 20 min today?"','Jordan — "You\'re close. Let\'s lock in confidence intervals before Thursday."','Devin — "Quick check-in? Office hours Wed, or I can set you a short plan."'].map(t=>`<div class="card" style="padding:12px 13px;font-size:13px;line-height:1.5">${t}</div>`).join('')}</div>
 <div style="display:flex;gap:10px;margin-top:16px"><button class="btn btn-outline" style="flex:1" onclick="closeSheet()">Edit</button><button class="btn btn-gold" style="flex:1.3" onclick="closeSheet();setTimeout(()=>burst(.5,.4),250)">${svg(I.send)} Send all 3</button></div>`,'auto');}
function openSession(){openSheet(`<h3>${svg(I.tutor)} 20-minute session</h3><p class="muted" style="margin-top:8px;font-size:13.5px;line-height:1.55">Atlas will run a focused, Socratic session on <b>Hypothesis Testing</b> using Dr. Reyes\'s own Lecture 7 and the Week 6 reading — then re-check your readiness.</p>
 <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><span class="badge badge-pine">Null vs alternative</span><span class="badge badge-pine">p-values</span><span class="badge badge-pine">Type I/II errors</span></div>
 <button class="btn btn-gold" style="width:100%;margin-top:18px" onclick="closeSheet()">${svg(I.spark)} Begin session</button>`,'auto');}

/* ---------- hero: coverage ---------- */
function animateCoverage(){
 const ring=$('#ring'),n=$('#ringN');if(!ring)return;const target=80;let t0;
 const f=ts=>{if(!t0)t0=ts;const p=Math.min((ts-t0)/1150,1);const e=1-Math.pow(1-p,3);const v=Math.round(e*target);ring.style.background=`conic-gradient(hsl(var(--gold)) ${v}%, hsl(var(--muted)) 0)`;n.textContent=v+'%';if(p<1)requestAnimationFrame(f);};requestAnimationFrame(f);
}
renderCmd();wire();render();
</script>
