<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atlas LMS — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF8; --surface:#FFFFFF; --surface-2:#F6F5F2;
  --ink:#16141B; --ink-2:#3A3741; --muted:#6E6A75; --faint:#9A96A1;
  --line:rgba(22,20,27,.09); --line-2:rgba(22,20,27,.05);
  --indigo:#4F46E5; --indigo-ink:#3730A3; --indigo-tint:rgba(79,70,229,.08);
  --agent:#7C5CFF; --agent-2:#A78BFA; --agent-tint:rgba(124,92,255,.07); --agent-line:rgba(124,92,255,.22);
  --ok:#15A66A; --ok-tint:rgba(21,166,106,.10);
  --amber:#D08700; --amber-tint:rgba(208,135,0,.10);
  --red:#DC2626; --red-tint:rgba(220,38,38,.09);
  --r-sm:9px; --r:13px; --r-lg:18px;
  --sh-1:0 1px 2px rgba(22,20,27,.05), 0 1px 1px rgba(22,20,27,.04);
  --sh-2:0 1px 2px rgba(22,20,27,.04), 0 14px 34px -16px rgba(22,20,27,.22);
  --sh-3:0 2px 4px rgba(22,20,27,.05), 0 28px 60px -24px rgba(22,20,27,.30);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  font-size:14px; line-height:1.5; letter-spacing:-.005em;
}
.serif{font-family:"Instrument Serif",Georgia,serif; letter-spacing:0; font-weight:400}
button{font:inherit; color:inherit; border:0; background:none; cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(22,20,27,.14); border-radius:99px; border:3px solid transparent; background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(22,20,27,.26); background-clip:padding-box}

/* ---------- App shell ---------- */
.app{display:grid; grid-template-columns:252px minmax(0,1fr) 392px; height:100vh; overflow:hidden; transition:grid-template-columns .34s var(--ease)}
.app.agent-collapsed{grid-template-columns:252px minmax(0,1fr) 0}

/* ---------- Sidebar ---------- */
.sidebar{background:var(--surface-2); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0}
.brand{display:flex; align-items:center; gap:10px; padding:18px 18px 14px}
.brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,#2A2440,#4F46E5 60%,#7C5CFF);display:grid;place-items:center;color:#fff;box-shadow:var(--sh-1);flex:none}
.brand .mark svg{width:17px;height:17px}
.brand .name{font-size:19px;line-height:1}
.brand .badge{margin-left:auto;font-size:10px;font-weight:600;letter-spacing:.04em;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:3px 7px;border-radius:99px}
.persona{margin:2px 14px 10px;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.persona button{flex:1;font-size:12.5px;font-weight:550;color:var(--muted);padding:7px 8px;border-radius:8px;transition:.18s var(--ease);display:flex;align-items:center;justify-content:center;gap:6px}
.persona button svg{width:14px;height:14px;opacity:.8}
.persona button[aria-selected=true]{background:var(--ink);color:#fff;box-shadow:var(--sh-1)}
.nav{flex:1;overflow-y:auto;padding:6px 12px 12px}
.nav .group{margin-top:14px}
.nav .glabel{font-size:10.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding:6px 10px 4px;display:flex;align-items:center;gap:7px}
.nav .glabel .code{color:var(--indigo);font-weight:700}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;color:var(--ink-2);font-weight:500;font-size:13.5px;cursor:pointer;transition:.14s var(--ease);position:relative}
.nav a svg{width:16px;height:16px;color:var(--faint);flex:none;transition:.14s}
.nav a .tail{margin-left:auto;font-size:11px;font-weight:600;color:var(--faint)}
.nav a .pip{margin-left:auto;width:7px;height:7px;border-radius:99px;background:var(--amber)}
.nav a:hover{background:rgba(22,20,27,.045);color:var(--ink)}
.nav a:hover svg{color:var(--ink-2)}
.nav a.active{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1);font-weight:600}
.nav a.active svg{color:var(--indigo)}
.nav a.active::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--indigo)}
.side-foot{border-top:1px solid var(--line);padding:11px 14px;display:flex;align-items:center;gap:10px}
.avatar{width:30px;height:30px;border-radius:99px;background:linear-gradient(135deg,#E9D5FF,#C7D2FE);display:grid;place-items:center;font-weight:650;color:var(--indigo-ink);font-size:12px;flex:none}
.side-foot .who{line-height:1.25;min-width:0}
.side-foot .who b{font-size:12.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot .who span{font-size:11px;color:var(--muted)}
.side-foot .cog{margin-left:auto;color:var(--faint);padding:5px;border-radius:7px}
.side-foot .cog:hover{background:rgba(22,20,27,.05);color:var(--ink)}

/* ---------- Main ---------- */
.main{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.topbar{height:54px;flex:none;display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(251,250,248,.85);backdrop-filter:blur(10px);position:relative;z-index:5}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.crumb b{color:var(--ink);font-weight:600}
.crumb svg{width:14px;height:14px;opacity:.5}
.topbar .spacer{flex:1}
.cmdk{display:flex;align-items:center;gap:9px;height:34px;padding:0 11px 0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted);font-size:12.5px;min-width:230px;transition:.16s var(--ease)}
.cmdk:hover{border-color:rgba(22,20,27,.18);box-shadow:var(--sh-1)}
.cmdk svg{width:14px;height:14px}
.cmdk .kbd{margin-left:auto;font-size:11px;font-weight:600;color:var(--faint);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.tbtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);border:1px solid transparent}
.tbtn:hover{background:var(--surface);border-color:var(--line);box-shadow:var(--sh-1)}
.tbtn svg{width:17px;height:17px}
.screen{flex:1;overflow-y:auto;scroll-behavior:smooth}
.wrap{max-width:920px;margin:0 auto;padding:30px 30px 80px}
.view-enter{animation:viewIn .4s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* page head */
.phead{margin-bottom:22px}
.phead .eyebrow{font-size:11.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--indigo);margin-bottom:7px}
.phead h1{font-size:27px;font-weight:680;letter-spacing:-.02em;line-height:1.12}
.phead h1.serif{font-size:34px;font-weight:400}
.phead p{color:var(--muted);margin-top:7px;font-size:14.5px;max-width:62ch}

/* cards & primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.row{display:flex;gap:14px}
.col{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface)}
.pill.ok{color:var(--ok);background:var(--ok-tint);border-color:transparent}
.pill.amber{color:var(--amber);background:var(--amber-tint);border-color:transparent}
.pill.red{color:var(--red);background:var(--red-tint);border-color:transparent}
.pill.indigo{color:var(--indigo-ink);background:var(--indigo-tint);border-color:transparent}
.pill.agent{color:#6D4BE0;background:var(--agent-tint);border-color:var(--agent-line)}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:10px;font-weight:600;font-size:13.5px;transition:.16s var(--ease);border:1px solid transparent;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--ink);color:#fff;box-shadow:var(--sh-1)}
.btn.primary:hover{transform:translateY(-1px);box-shadow:var(--sh-2)}
.btn.agent{background:linear-gradient(135deg,#6D4BE0,#8B6CFF);color:#fff;box-shadow:0 6px 18px -8px rgba(124,92,255,.7)}
.btn.agent:hover{transform:translateY(-1px);filter:saturate(1.1)}
.btn.ghost{border-color:var(--line);background:var(--surface);color:var(--ink)}
.btn.ghost:hover{border-color:rgba(22,20,27,.2);box-shadow:var(--sh-1)}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px;border-radius:9px}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--sh-1)}
.tile .k{font-size:11.5px;color:var(--muted);font-weight:550;display:flex;align-items:center;gap:6px}
.tile .k svg{width:14px;height:14px;color:var(--faint)}
.tile .v{font-size:25px;font-weight:680;letter-spacing:-.02em;margin-top:7px}
.tile .v small{font-size:13px;font-weight:600;color:var(--muted)}

/* attention list */
.att{display:flex;gap:13px;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);align-items:flex-start;transition:.16s var(--ease)}
.att+.att{margin-top:10px}
.att:hover{box-shadow:var(--sh-2);transform:translateY(-1px)}
.att .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
.att .ic svg{width:17px;height:17px}
.att .bd{flex:1;min-width:0}
.att .bd h4{font-size:14px;font-weight:600}
.att .bd p{font-size:13px;color:var(--muted);margin-top:2px}
.att .act{display:flex;gap:8px;margin-top:11px}

/* ---------- Agent panel ---------- */
.agent{background:linear-gradient(180deg,#FCFBFF, #FAF9FE);border-left:1px solid var(--agent-line);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.agent-head{height:54px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line)}
.agent-orb{width:26px;height:26px;border-radius:8px;background:linear-gradient(145deg,#6D4BE0,#A78BFA);display:grid;place-items:center;color:#fff;box-shadow:0 4px 12px -4px rgba(124,92,255,.8);flex:none}
.agent-orb svg{width:15px;height:15px}
.agent-head .t{line-height:1.2}
.agent-head .t b{font-size:13.5px;font-weight:650}
.agent-head .t span{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:99px;background:var(--ok);box-shadow:0 0 0 3px var(--ok-tint)}
.dot.busy{background:var(--agent);box-shadow:0 0 0 3px var(--agent-tint);animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.4}}
.agent-head .stop{margin-left:auto;display:none;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--red);background:var(--red-tint);border-radius:8px;padding:6px 10px}
.agent-head .stop svg{width:13px;height:13px}
.agent.busy .stop{display:inline-flex}
.agent-head .min{margin-left:auto;color:var(--faint);padding:6px;border-radius:7px}
.agent.busy .min{display:none}
.agent-head .min:hover{background:rgba(22,20,27,.05);color:var(--ink)}
.agent-body{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:12px}
.goal{border:1px solid var(--agent-line);background:var(--agent-tint);border-radius:12px;padding:11px 12px}
.goal .gl{font-size:10.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:#7257D6;display:flex;align-items:center;gap:6px}
.goal .gt{font-size:13px;font-weight:550;color:var(--ink);margin-top:5px}
.goal .gs{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11.5px;color:var(--muted)}
.msg{display:flex;gap:9px}
.msg .who{width:24px;height:24px;border-radius:7px;flex:none;display:grid;place-items:center;font-size:10px;font-weight:700}
.msg.me .who{background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.msg.ai .who{background:linear-gradient(145deg,#6D4BE0,#A78BFA);color:#fff}
.msg .bubble{font-size:13.5px;line-height:1.55;color:var(--ink-2);padding-top:2px}
.msg.me .bubble{color:var(--ink);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 2px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:550;padding:5px 9px;border-radius:99px;border:1px dashed var(--agent-line);background:rgba(124,92,255,.05);color:#5B43B8;transition:.16s var(--ease);opacity:0;transform:translateY(4px);animation:chipIn .34s var(--ease) forwards}
.chip svg{width:12px;height:12px}
.chip.solid{border-style:solid}
.chip .x{opacity:.5}
.chip:hover .x{opacity:1}
@keyframes chipIn{to{opacity:1;transform:none}}
.tool{display:flex;align-items:center;gap:9px;font-size:12.5px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;opacity:0;transform:translateY(4px);animation:chipIn .3s var(--ease) forwards}
.tool .ti{width:22px;height:22px;border-radius:6px;background:var(--agent-tint);display:grid;place-items:center;flex:none}
.tool .ti svg{width:13px;height:13px;color:#6D4BE0}
.tool .tt{flex:1;color:var(--ink-2)} .tool .tt b{font-weight:600;color:var(--ink)}
.tool .spin{width:13px;height:13px;border:2px solid var(--agent-line);border-top-color:var(--agent);border-radius:99px;animation:sp .7s linear infinite}
.tool .chk{color:var(--ok)}
@keyframes sp{to{transform:rotate(360deg)}}
.reason{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.reason summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 11px;font-size:12px;color:var(--muted);font-weight:550}
.reason summary::-webkit-details-marker{display:none}
.reason summary svg{width:13px;height:13px;transition:.2s}
.reason[open] summary svg.caret{transform:rotate(90deg)}
.reason .rb{padding:0 12px 11px 30px;font-size:12px;color:var(--muted);line-height:1.6}
.agent-foot{flex:none;border-top:1px solid var(--line);padding:12px}
.composer{border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:8px 8px 8px 12px;display:flex;align-items:flex-end;gap:8px;box-shadow:var(--sh-1);transition:.16s}
.composer:focus-within{border-color:var(--agent-line);box-shadow:0 0 0 3px var(--agent-tint)}
.composer textarea{flex:1;border:0;outline:0;resize:none;font:inherit;font-size:13.5px;background:none;max-height:90px;line-height:1.5;padding:5px 0}
.composer .send{width:32px;height:32px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none;transition:.16s}
.composer .send:hover{background:var(--agent)}
.composer .send svg{width:15px;height:15px}
.auto{display:flex;align-items:center;gap:8px;margin-top:9px;padding:0 3px;font-size:11px;color:var(--muted)}
.auto .track{margin-left:auto;display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:2px}
.auto .track button{font-size:10.5px;font-weight:600;color:var(--muted);padding:3px 8px;border-radius:99px}
.auto .track button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}

/* authoring artifact */
.proposal-bar{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--agent-line);background:linear-gradient(180deg,#fff,#FBFAFF);border-radius:var(--r);box-shadow:var(--sh-2);margin-bottom:16px}
.proposal-bar .tag{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#6D4BE0;background:var(--agent-tint);padding:4px 9px;border-radius:7px;border:1px solid var(--agent-line)}
.proposal-bar.published .tag{color:var(--ok);background:var(--ok-tint);border-color:transparent}
.proposal-bar .diff{font-size:12.5px;color:var(--muted)}
.proposal-bar .diff b.add{color:var(--ok)}
.proposal-bar .sp{flex:1}
.obj{display:flex;gap:11px;padding:13px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--sh-1)}
.obj .lo{font-size:11px;font-weight:700;color:var(--indigo);background:var(--indigo-tint);border-radius:7px;padding:4px 7px;height:fit-content;flex:none}
.obj .ob{flex:1}
.obj .ob h4{font-size:13.5px;font-weight:600}
.obj .ob .bloom{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.modrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--sh-1)}
.modrow .num{width:26px;height:26px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink-2);flex:none}
.modrow .mt{flex:1;min-width:0} .modrow .mt b{font-size:13.5px;font-weight:600} .modrow .mt p{font-size:12px;color:var(--muted);margin-top:1px}
.stagger{opacity:0;transform:translateY(8px);animation:chipIn .42s var(--ease) forwards}
.sectlabel{display:flex;align-items:center;gap:9px;margin:20px 0 11px;font-size:12.5px;font-weight:650;color:var(--ink)}
.sectlabel .ln{flex:1;height:1px;background:var(--line)}
.sectlabel .ct{font-size:11px;color:var(--faint);font-weight:600}

/* coverage / tutor */
.cov{display:flex;gap:22px;align-items:center}
.ring{--p:0;width:128px;height:128px;border-radius:99px;flex:none;background:conic-gradient(var(--indigo) calc(var(--p)*1%), var(--surface-2) 0);display:grid;place-items:center;position:relative;transition:--p 1s var(--ease)}
.ring::after{content:"";position:absolute;inset:11px;background:var(--surface);border-radius:99px;box-shadow:inset 0 1px 2px rgba(0,0,0,.04)}
.ring .rv{position:relative;z-index:1;text-align:center}
.ring .rv b{font-size:30px;font-weight:700;letter-spacing:-.02em}
.ring .rv span{font-size:10.5px;color:var(--muted);font-weight:600;display:block;text-transform:uppercase;letter-spacing:.05em}
.cbar{margin-top:9px}
.cbar+.cbar{margin-top:11px}
.cbar .cl{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:5px}
.cbar .cl .lo{font-size:10px;font-weight:700;color:var(--indigo);background:var(--indigo-tint);padding:2px 6px;border-radius:5px}
.cbar .cl .pct{margin-left:auto;font-weight:600;color:var(--ink-2)}
.cbar .tr{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.cbar .fl{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--indigo),#6D4BE0);width:0;transition:width 1.1s var(--ease)}
.cbar.gap .fl{background:linear-gradient(90deg,#E0A21A,var(--amber))}
.cite{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--indigo-ink);background:var(--indigo-tint);border-radius:6px;padding:3px 7px;cursor:pointer;transition:.14s}
.cite svg{width:11px;height:11px}
.cite:hover{background:rgba(79,70,229,.16)}
.tutor-q{align-self:flex-end;max-width:80%;background:var(--ink);color:#fff;padding:9px 13px;border-radius:13px 13px 4px 13px;font-size:13.5px;font-weight:500}
.tutor-a{max-width:92%;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.tutor-a .cites{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}

/* command palette */
.cmd-overlay{position:fixed;inset:0;background:rgba(22,20,27,.34);backdrop-filter:blur(3px);display:none;place-items:flex-start center;z-index:50;animation:fade .18s ease}
.cmd-overlay.show{display:grid}
@keyframes fade{from{opacity:0}}
.cmd{width:min(640px,92vw);margin-top:13vh;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-3);overflow:hidden;animation:cmdIn .22s var(--ease)}
@keyframes cmdIn{from{opacity:0;transform:translateY(-10px) scale(.98)}}
.cmd .ci{display:flex;align-items:center;gap:11px;padding:15px 17px;border-bottom:1px solid var(--line)}
.cmd .ci svg{width:18px;height:18px;color:var(--agent)}
.cmd .ci input{flex:1;border:0;outline:0;font:inherit;font-size:15px;background:none}
.cmd .grp{padding:8px}
.cmd .gh{font-size:10.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:7px 10px 4px}
.cmd .opt{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:10px;cursor:pointer;font-size:13.5px}
.cmd .opt:hover,.cmd .opt.sel{background:var(--agent-tint)}
.cmd .opt svg{width:16px;height:16px;color:var(--muted)}
.cmd .opt .k{margin-left:auto;font-size:11px;color:var(--faint)}
.cmd .opt.sel svg{color:var(--agent)}

.fadein{animation:viewIn .4s var(--ease) both}
@media(max-width:1180px){.app{grid-template-columns:212px minmax(0,1fr) 360px}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 16 9 5 9-5M3 12l9 5 9-5"/></svg></div>
      <div class="name serif">Atlas</div>
      <div class="badge">DEMO</div>
    </div>
    <div class="persona" id="persona"></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sidefoot"></div>
  </aside>

  <section class="main">
    <header class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="spacer"></div>
      <button class="cmdk" id="cmdkBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        Ask Atlas or search…
        <span class="kbd">⌘K</span>
      </button>
      <button class="tbtn" title="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
    </header>
    <div class="screen" id="screen"></div>
  </section>

  <aside class="agent" id="agentPanel">
    <div class="agent-head">
      <div class="agent-orb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 1.9 4.6L18.5 9l-4.6 1.9L12 15l-1.9-4.1L5.5 9l4.6-1.4Z"/><path d="M5 17l.8 2L8 20l-2.2.9L5 23l-.8-2.1L2 20l2.2-1Z"/></svg></div>
      <div class="t"><b>Atlas</b><span id="agentStatus"><span class="dot"></span> Ready</span></div>
      <button class="min" id="agentMin" title="Collapse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></button>
      <button class="stop" id="agentStop"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg> Stop</button>
    </div>
    <div class="agent-body" id="agentBody"></div>
    <div class="agent-foot">
      <div class="composer">
        <textarea id="composer" rows="1" placeholder="Message Atlas…"></textarea>
        <button class="send" id="composerSend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button>
      </div>
      <div class="auto">
        <span>Autonomy</span>
        <div class="track" id="autonomy">
          <button data-a="ask" aria-selected="true">Approve each</button>
          <button data-a="auto">Auto + review</button>
          <button data-a="run">Run &amp; summarize</button>
        </div>
      </div>
    </div>
  </aside>
</div>

<div class="cmd-overlay" id="cmdOverlay">
  <div class="cmd">
    <div class="ci">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 1.9 4.6L18.5 9l-4.6 1.9L12 15l-1.9-4.1L5.5 9l4.6-1.4Z"/></svg>
      <input id="cmdInput" placeholder="Ask Atlas to do something, or jump to…" />
    </div>
    <div id="cmdList"></div>
  </div>
</div>

<script>
/* ---------------- icons ---------------- */
const I = {
  today:'<path d="M3 9h18M3 15h18M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/>',
  book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>',
  cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.5 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.5A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.5Z"/>',
  layers:'<path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 17l9 5 9-5"/>',
  task:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  quiz:'<path d="M9.1 9a3 3 0 1 1 4.5 2.6c-.9.5-1.6 1.4-1.6 2.4"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="10"/>',
  rubric:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>',
  grade:'<path d="M3 3v18h18"/><rect x="7" y="11" width="3" height="6"/><rect x="12" y="7" width="3" height="10"/><rect x="17" y="13" width="3" height="4"/>',
  disc:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/>',
  ann:'<path d="m3 11 18-5v12L3 14v-3Z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>',
  people:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  chart:'<path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/>',
  files:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/>',
  tutor:'<path d="m12 3 1.9 4.6L18.5 9l-4.6 1.9L12 15l-1.9-4.1L5.5 9l4.6-1.4Z"/>',
  cap:'<path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', spark:'<path d="m12 3 1.9 4.6L18.5 9l-4.6 1.9L12 15l-1.9-4.1L5.5 9Z"/>',
  cog:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-2.82 1.17 2 2 0 0 1-4 0 1.65 1.65 0 0 0-2.82-1.17l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.5 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.27.6.86 1 1.5 1H21a2 2 0 0 1 0 4h-.09c-.64 0-1.23.4-1.5 1Z"/>',
  warn:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  check:'<path d="M20 6 9 17l-5-5"/>', wand:'<path d="m15 4 5 5L8 21H3v-5Z"/><path d="m14 5 5 5"/>',
  doc:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M9 13h6M9 17h4"/>',
  send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
};
const svg = (p,w)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||2}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const $ = (s,r=document)=>r.querySelector(s);
const el = (h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild;};

/* ---------------- nav config ---------------- */
const NAV = {
  professor:[
    {g:'Workspace',items:[['today','Today',I.today],['courses','Courses',I.book],['calendar','Calendar',I.cal],['inbox','Inbox',I.inbox,'3']]},
    {g:'STAT-201 · Applied Statistics',code:1,items:[
      ['authoring','Course Builder',I.layers,'ai'],['modules','Modules',I.layers],['assignments','Assignments',I.task],
      ['gradebook','Gradebook',I.grade,'pip'],['outcomes','Outcomes',I.target],['analytics','Analytics',I.chart]]},
  ],
  student:[
    {g:'Workspace',items:[['today','Today',I.today],['courses','Courses',I.book],['calendar','Calendar',I.cal],['inbox','Inbox',I.inbox]]},
    {g:'STAT-201 · Applied Statistics',code:1,items:[
      ['home','Course Home',I.book],['modules','Modules',I.layers],['assignments','Assignments',I.task],
      ['grades','Grades',I.grade],['tutor','Atlas Tutor',I.tutor,'ai']]},
  ],
};
const PERSONAS=[['professor','Professor',I.cap],['student','Student',I.book]];
const USER={professor:{n:'Dr. Elena Reyes',r:'Instructor · Statistics',i:'ER'},student:{n:'Maya Patel',r:'Student · B+ avg',i:'MP'}};
const TITLES={today:'Today',courses:'Courses',calendar:'Calendar',inbox:'Inbox',authoring:'Course Builder',modules:'Modules',assignments:'Assignments',gradebook:'Gradebook',outcomes:'Outcomes',analytics:'Analytics',home:'Course Home',grades:'Grades',tutor:'Atlas Tutor'};

let S={persona:'professor',view:'today',autonomy:'ask',authored:false};

/* ---------------- chrome render ---------------- */
function renderPersona(){
  const p=$('#persona'); p.innerHTML='';
  PERSONAS.forEach(([id,label,ic])=>{
    const b=el(`<button aria-selected="${S.persona===id}">${svg(ic)} ${label}</button>`);
    b.onclick=()=>{S.persona=id; S.view=(id==='professor'?'today':'today'); render();};
    p.appendChild(b);
  });
}
function renderNav(){
  const n=$('#nav'); n.innerHTML='';
  NAV[S.persona].forEach(grp=>{
    const g=el(`<div class="group"></div>`);
    g.appendChild(el(`<div class="glabel">${grp.code?'<span class="code">STAT-201</span> · Applied Statistics':grp.g}</div>`));
    grp.items.forEach(([id,label,ic,tail])=>{
      const a=el(`<a class="${S.view===id?'active':''}">${svg(ic)}<span>${label}</span>${tail==='ai'?'<span class="pill agent" style="margin-left:auto;padding:1px 7px">AI</span>':tail==='pip'?'<span class="pip"></span>':tail?`<span class="tail">${tail}</span>`:''}</a>`);
      a.onclick=()=>{S.view=id; render();};
      g.appendChild(a);
    });
    n.appendChild(g);
  });
}
function renderFoot(){
  const u=USER[S.persona];
  $('#sidefoot').innerHTML=`<div class="avatar">${u.i}</div><div class="who"><b>${u.n}</b><span>${u.r}</span></div><button class="cog">${svg(I.cog)}</button>`;
}
function renderCrumb(){
  const inCourse=!['today','courses','calendar','inbox'].includes(S.view);
  $('#crumb').innerHTML=`${svg(I.cap,2)}<span>${S.persona==='professor'?'Teaching':'Learning'}</span>${inCourse?`${svg('<path d="m9 6 6 6-6 6"/>')}<b>STAT-201</b>`:''}${svg('<path d="m9 6 6 6-6 6"/>')}<b>${TITLES[S.view]||'Today'}</b>`;
}

/* ---------------- command palette ---------------- */
const CMDS=[
  {g:'Ask Atlas',o:[['Draft a full course from a description',I.wand,'authoring'],['Find students who are falling behind',I.warn,'gradebook'],['Explain a concept from my course',I.tutor,'tutor']]},
  {g:'Navigate',o:[['Go to Today',I.today,'today'],['Open Course Builder',I.layers,'authoring'],['Open Gradebook',I.grade,'gradebook'],['Open Outcomes',I.target,'outcomes']]},
];
function openCmd(){const o=$('#cmdOverlay');o.classList.add('show');const inp=$('#cmdInput');inp.value='';inp.focus();}
function closeCmd(){$('#cmdOverlay').classList.remove('show');}
function renderCmd(){
  const l=$('#cmdList');l.innerHTML='';
  CMDS.forEach(grp=>{
    const d=el(`<div class="grp"><div class="gh">${grp.g}</div></div>`);
    grp.o.forEach(([label,ic,view])=>{
      const o=el(`<div class="opt">${svg(ic)}<span>${label}</span><span class="k">↵</span></div>`);
      o.onclick=()=>{closeCmd();if(S.persona==='student'&&view==='gradebook'){S.view='grades';}else{S.view=view;}render();if(view==='authoring')setTimeout(runAuthoring,500);};
      d.appendChild(o);
    });
    l.appendChild(d);
  });
}

/* ---------------- wiring ---------------- */
function wireChrome(){
  $('#cmdkBtn').onclick=openCmd;
  $('#cmdOverlay').onclick=(e)=>{if(e.target.id==='cmdOverlay')closeCmd();};
  document.addEventListener('keydown',(e)=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCmd();}if(e.key==='Escape')closeCmd();});
  $('#agentMin').onclick=()=>$('#app').classList.toggle('agent-collapsed');
  $('#autonomy').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.autonomy=b.dataset.a;$('#autonomy').querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected',x===b));});
  const c=$('#composer');c.oninput=()=>{c.style.height='auto';c.style.height=Math.min(c.scrollHeight,90)+'px';};
}

function render(){
  renderPersona();renderNav();renderFoot();renderCrumb();
  renderScreen();renderAgent();
}
/* ---------------- screens ---------------- */
function renderScreen(){
  const s=$('#screen');
  const key=S.persona+'/'+S.view;
  s.innerHTML=`<div class="wrap view-enter">${SCREENS[key]?SCREENS[key]():generic(TITLES[S.view]||'Workspace')}</div>`;
  if(key==='student/tutor') requestAnimationFrame(()=>animateCoverage());
  if(key==='professor/authoring'){ const b=$('#runAuthoring'); if(b) b.onclick=runAuthoring; if(S.authored) paintAuthored(true); }
  if(key==='professor/gradebook'){ const g=$('#approveGrades'); if(g) g.onclick=()=>{g.closest('.card').querySelector('.gv-state').innerHTML='<span class="pill ok">'+svg(I.check)+' Posted to 18 students</span>'; g.remove(); $('#editGrades')?.remove();}; }
}
function generic(t){
  return `<div class="phead"><div class="eyebrow">STAT-201</div><h1>${t}</h1><p>This surface is part of Atlas's full LMS. In the live product it carries complete Canvas/Blackboard parity — here we focus the demo on the agent-driven flows.</p></div>
  <div class="card" style="padding:30px;display:flex;gap:16px;align-items:center"><div class="agent-orb" style="width:40px;height:40px;border-radius:12px">${svg(I.spark)}</div>
  <div style="flex:1"><b style="font-size:15px">Atlas can run this for you</b><p class="muted" style="margin-top:3px">Press ⌘K and tell Atlas what you want — it drafts, you approve. Nothing here changes without your sign-off.</p></div>
  <button class="btn agent" onclick="openCmd()">${svg(I.spark)} Ask Atlas</button></div>`;
}
const tile=(k,ic,v,sub)=>`<div class="tile"><div class="k">${svg(ic)} ${k}</div><div class="v">${v}${sub?` <small>${sub}</small>`:''}</div></div>`;
const att=(tone,ic,h,p,acts)=>`<div class="att"><div class="ic" style="background:var(--${tone}-tint);color:var(--${tone})">${svg(ic)}</div><div class="bd"><h4>${h}</h4><p>${p}</p><div class="act">${acts}</div></div></div>`;

const SCREENS={
  'professor/today':()=>`
    <div class="phead"><div class="eyebrow">Tuesday · Week 6</div><h1 class="serif">Good morning, Dr. Reyes.</h1><p>Three things need your attention today. Atlas has drafts ready for each — review and approve.</p></div>
    <div class="tiles" style="margin-bottom:22px">
      ${tile('Active course',I.book,'STAT-201')}${tile('Students',I.people,'32')}${tile('Needs grading',I.task,'18',' subs')}${tile('At-risk',I.warn,'3')}
    </div>
    <div class="sectlabel">Needs your attention <span class="ln"></span><span class="ct">Atlas · prioritized</span></div>
    ${att('red',I.warn,'3 students slipping in Hypothesis Testing','Maya, Jordan & Devin haven\'t opened Week 6 — it\'s 30% of Midterm 2. Atlas drafted a personalized nudge to each.',`<button class="btn agent sm" onclick="openCmd()">${svg(I.wand)} Review nudges</button><button class="btn ghost sm">View students</button>`)}
    ${att('indigo',I.task,'18 submissions ready — Problem Set 4','Atlas pre-graded every submission against your rubric and drafted feedback. You approve or adjust before anything posts.',`<button class="btn agent sm" onclick="S.view='gradebook';render()">${svg(I.check)} Review grading</button>`)}
    ${att('amber',I.target,'Coverage gap before Midterm 2','Your new “ANOVA” module isn\'t aligned to any learning objective yet, so it won\'t show in student readiness.',`<button class="btn agent sm" onclick="S.view='outcomes';render()">${svg(I.target)} Align it</button>`)}`,

  'professor/authoring':()=>`
    <div class="phead"><div class="eyebrow">Course Builder · AI</div><h1>Build a course with Atlas</h1><p>Describe the course in plain language. Atlas drafts objectives, a module map, and aligned assessments — as a proposal you review before anything is created.</p></div>
    <div class="card" id="builderPrompt" style="padding:18px">
      <div style="display:flex;gap:11px;align-items:flex-start">
        <div class="agent-orb" style="width:34px;height:34px;border-radius:10px;flex:none">${svg(I.spark)}</div>
        <div style="flex:1">
          <div style="font-size:14.5px;line-height:1.55;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:var(--surface-2)">“Build a 14-week <b>Applied Statistics</b> course for undergrads, aligned to our 5 program outcomes. Weekly modules, two midterms and a final project. Emphasize hypothesis testing and regression.”</div>
          <div class="chips" style="margin-top:10px">
            <span class="chip solid" style="animation-delay:.05s">${svg(I.target)} 5 program outcomes</span>
            <span class="chip solid" style="animation-delay:.1s">${svg(I.cal)} 14 weeks</span>
            <span class="chip solid" style="animation-delay:.15s">${svg(I.task)} 2 midterms + project</span>
          </div>
        </div>
      </div>
      <div style="display:flex;gap:10px;margin-top:16px;padding-left:45px">
        <button class="btn agent" id="runAuthoring">${svg(I.wand)} Draft the course</button>
        <button class="btn ghost">Edit prompt</button>
      </div>
    </div>
    <div id="artifact"></div>`,

  'professor/gradebook':()=>`
    <div class="phead"><div class="eyebrow">Gradebook · Problem Set 4</div><h1>Grading, drafted for you</h1><p>Atlas scored all 18 submissions against your rubric and wrote feedback in your voice. Everything stays a private draft until you post.</p></div>
    ${att('red',I.warn,'Early warning — 3 students trending down','Devin\'s last 3 scores dropped 22%. Atlas suggests a check-in before the midterm.',`<button class="btn ghost sm">See trajectory</button>`)}
    <div class="card" style="padding:0;margin-top:16px;overflow:hidden">
      <div style="padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px"><b style="font-size:14px">Maya Patel</b><span class="pill">Submission 1 / 18</span><span class="pill agent">${svg(I.spark)} AI-drafted</span><span class="gv-state" style="margin-left:auto"><span class="pill amber">Draft · not posted</span></span></div>
      <div style="display:grid;grid-template-columns:1fr 280px">
        <div style="padding:16px;border-right:1px solid var(--line)">
          <div class="muted" style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Drafted feedback</div>
          <p style="font-size:13.5px;line-height:1.6;color:var(--ink-2)">Strong work on the confidence interval, Maya — your interpretation of the margin of error is exactly right. Watch your null hypothesis phrasing in Q3: you tested the alternative directly. Revisit <span class="cite">${svg(I.doc)} Lecture 7 · slide 12</span> and you\'ll nail it next time.</p>
        </div>
        <div style="padding:16px">
          <div class="muted" style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px">Rubric</div>
          <div style="display:flex;flex-direction:column;gap:9px">
            <div style="display:flex;justify-content:space-between;font-size:13px"><span>Method</span><b>9 / 10</b></div>
            <div style="display:flex;justify-content:space-between;font-size:13px"><span>Interpretation</span><b>8 / 10</b></div>
            <div style="display:flex;justify-content:space-between;font-size:13px"><span>Communication</span><b class="muted">7 / 10</b></div>
            <div style="display:flex;justify-content:space-between;font-size:14px;border-top:1px solid var(--line);padding-top:9px"><b>Total</b><b>24 / 30</b></div>
          </div>
        </div>
      </div>
      <div style="padding:13px 16px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;background:var(--surface-2)">
        <span class="muted" style="font-size:12.5px">Approving posts grades + feedback to all 18 students.</span>
        <div style="margin-left:auto;display:flex;gap:9px">
          <button class="btn ghost sm" id="editGrades">Edit each</button>
          <button class="btn agent sm" id="approveGrades">${svg(I.check)} Approve all 18</button>
        </div>
      </div>
    </div>`,

  'professor/outcomes':()=>`
    <div class="phead"><div class="eyebrow">Outcomes · Alignment Graph</div><h1>Every artifact, mapped to intent</h1><p>Atlas keeps content tied to learning objectives and program outcomes — so coverage gaps and accreditation evidence are a query, not a spreadsheet.</p></div>
    <div class="card" style="padding:18px">
      ${['LO1 · Summarize data with descriptive statistics','LO2 · Apply hypothesis testing to a sample','LO3 · Model relationships with regression','LO4 · Communicate statistical findings'].map((o,i)=>`
      <div class="cbar"><div class="cl"><span class="lo">${o.split(' · ')[0]}</span> ${o.split(' · ')[1]} <span class="pct">${[12,9,7,4][i]} items</span></div><div class="tr"><div class="fl" style="width:${[92,78,64,30][i]}%;${i===3?'background:linear-gradient(90deg,#E0A21A,var(--amber))':''}"></div></div></div>`).join('')}
      <div class="att" style="margin-top:16px;border-style:dashed">${svg(I.warn)}<div class="bd"><h4 style="font-size:13.5px">ANOVA module is unaligned</h4><p>Atlas can map it to LO2 & LO3 and surface it in student readiness.</p></div><button class="btn agent sm">${svg(I.spark)} Auto-align</button></div>
    </div>`,

  'student/today':()=>`
    <div class="phead"><div class="eyebrow">Tuesday · Week 6</div><h1 class="serif">Hey Maya — here\'s what matters.</h1><p>Not everything. The two things that move your grade, and where you\'re behind for Midterm 2.</p></div>
    <div class="grid2" style="margin-bottom:8px">
      <div class="card" style="padding:16px"><div class="k muted" style="font-size:12px;font-weight:600;display:flex;gap:7px;align-items:center">${svg(I.clock)} Due in 2 days</div><div style="font-size:16px;font-weight:650;margin-top:8px">Problem Set 4 — Hypothesis Testing</div><p class="muted" style="font-size:13px;margin-top:3px">~2 hrs · counts toward LO2</p><button class="btn agent sm" style="margin-top:12px" onclick="S.view='tutor';render()">${svg(I.tutor)} Study with Atlas</button></div>
      <div class="card" style="padding:16px"><div class="k muted" style="font-size:12px;font-weight:600;display:flex;gap:7px;align-items:center">${svg(I.target)} Midterm 2 readiness</div><div style="font-size:16px;font-weight:650;margin-top:8px;color:var(--amber)">80% ready — one gap</div><p class="muted" style="font-size:13px;margin-top:3px">You haven\'t practiced Hypothesis Testing (LO4)</p><button class="btn ghost sm" style="margin-top:12px" onclick="S.view='tutor';render()">See my coverage</button></div>
    </div>
    ${att('indigo',I.ann,'New from Dr. Reyes','“Midterm 2 will weight hypothesis testing heavily.” Atlas already factored this into your readiness.',`<button class="btn ghost sm">Open</button>`)}`,

  'student/tutor':()=>`
    <div class="phead"><div class="eyebrow">Atlas Tutor · grounded in your course</div><h1>Am I ready for Midterm 2?</h1><p>Atlas knows exactly what Dr. Reyes will assess — and measures you against it. No surprises.</p></div>
    <div class="card" style="padding:20px;margin-bottom:16px">
      <div class="cov">
        <div class="ring" id="covRing"><div class="rv"><b id="covNum">0%</b><span>ready</span></div></div>
        <div style="flex:1">
          <div style="font-size:14.5px;font-weight:600;margin-bottom:3px">Midterm 2 readiness — by objective</div>
          <p class="muted" style="font-size:13px;margin-bottom:12px">Weighted by what the exam actually assesses.</p>
          <div class="cbar" data-w="92"><div class="cl"><span class="lo">LO1</span> Descriptive statistics <span class="pct">92%</span></div><div class="tr"><div class="fl"></div></div></div>
          <div class="cbar" data-w="74"><div class="cl"><span class="lo">LO3</span> Regression <span class="pct">74%</span></div><div class="tr"><div class="fl"></div></div></div>
          <div class="cbar gap" data-w="28"><div class="cl"><span class="lo">LO4</span> Hypothesis testing <span class="pct" style="color:var(--amber)">28% · 30% of exam</span></div><div class="tr"><div class="fl"></div></div></div>
        </div>
      </div>
      <div class="att" style="margin-top:18px;border-color:var(--amber-tint);background:var(--amber-tint)">${svg(I.warn)}<div class="bd"><h4 style="font-size:13.5px">Your biggest risk: Hypothesis Testing</h4><p>It\'s 30% of the midterm and your weakest area. A focused 20-minute session would move you most.</p></div><button class="btn agent sm">${svg(I.tutor)} Start session</button></div>
    </div>`,
};

/* ---------------- agent panel ---------------- */
function goalCard(label,text,status){return `<div class="goal"><div class="gl">${svg(I.target)} Current goal</div><div class="gt">${text}</div><div class="gs"><span class="dot ${status==='active'?'busy':''}"></span> ${label}</div></div>`;}
function aiMsg(html){return `<div class="msg ai"><div class="who">A</div><div class="bubble">${html}</div></div>`;}
function meMsg(html){return `<div class="msg me"><div class="who">${USER[S.persona].i}</div><div class="bubble">${html}</div></div>`;}

function renderAgent(){
  const b=$('#agentBody');const key=S.persona+'/'+S.view;
  $('#agentPanel').classList.remove('busy');$('#agentStatus').innerHTML='<span class="dot"></span> Ready';
  if(key==='professor/authoring'){
    b.innerHTML=goalCard('Paused · press “Draft the course”','Design STAT-201 from Dr. Reyes\'s brief','idle')
      +aiMsg('I\'ll propose objectives, a 14-week module map, and aligned assessments. You\'ll review everything as a draft before anything is created.')
      +`<div id="agentRun"></div>`;
    return;
  }
  if(key==='student/tutor'){
    b.innerHTML=goalCard('Active','Prep Maya for Midterm 2','active')
      +meMsg('Can you explain a null hypothesis? I keep getting it wrong.')
      +aiMsg('Great place to start — it\'s exactly what Dr. Reyes weights most. Quick check first: in your own words, what do you think you\'re testing <i>against</i>?<div class="tutor-a"><div class="cites"><span class="cite">'+svg(I.doc)+' Lecture 7 · slide 12</span><span class="cite">'+svg(I.doc)+' Syllabus · §Assessment</span></div></div>')
      +aiMsg('I\'ll teach from your course\'s own slides — and only count you as “ready” once you can apply it, not just recall it.');
    return;
  }
  if(key==='professor/gradebook'){
    b.innerHTML=goalCard('Active · awaiting your approval','Grade Problem Set 4 (18 submissions)','active')
      +aiMsg('I scored every submission against your 3-criterion rubric and drafted feedback in your voice. Nothing posts until you approve.')
      +toolCard('Read 18 submissions',true)+toolCard('Applied rubric · flagged 2 edge cases',true)+toolCard('Drafted feedback',true);
    return;
  }
  // default briefing
  b.innerHTML=goalCard('Ready','Help with '+(TITLES[S.view]||'your day'),'idle')
    +aiMsg(S.persona==='professor'?'Good morning. I\'ve triaged your day — <b>3 items need attention</b>, all with drafts ready. Want me to start with grading?':'Hey Maya. You\'re in good shape except <b>one gap</b> before Midterm 2. Want a quick plan?')
    +`<div class="chips"><span class="chip solid" onclick="${S.persona==='professor'?`S.view='gradebook';render()`:`S.view='tutor';render()`}">${svg(I.spark)} ${S.persona==='professor'?'Review grading':'Show my coverage'}</span><span class="chip solid" onclick="openCmd()">${svg(I.wand)} Something else</span></div>`;
}
function toolCard(t,done){return `<div class="tool"><div class="ti">${svg(I.spark)}</div><div class="tt">${t}</div>${done?`<span class="chk">${svg(I.check)}</span>`:'<span class="spin"></span>'}</div>`;}

/* ---------------- hero: authoring stream ---------------- */
const OBJS=[['LO1','Summarize and visualize data with descriptive statistics','Understand'],['LO2','Apply hypothesis testing to draw inferences from a sample','Apply'],['LO3','Model relationships between variables using regression','Analyze'],['LO4','Evaluate statistical claims and communicate findings','Evaluate'],['LO5','Design a study and defend its methodology','Create']];
const MODS=[['Foundations & Data','Types, sampling, visualization','LO1'],['Descriptive Statistics','Center, spread, distributions','LO1'],['Probability','Rules, distributions, the normal model','LO1·LO2'],['Sampling Distributions','CLT, standard error','LO2'],['Confidence Intervals','Estimation & margin of error','LO2'],['Hypothesis Testing','Null/alternative, p-values, errors','LO2·LO4']];
const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));

async function runAuthoring(){
  if(S.authedRunning)return; S.authedRunning=true;
  $('#agentPanel').classList.add('busy');$('#agentStatus').innerHTML='<span class="dot busy"></span> Working…';
  const run=$('#agentRun'); const art=$('#artifact'); const prompt=$('#builderPrompt');
  if(prompt) prompt.style.opacity=.5;
  run.innerHTML='';
  // plan chips
  run.insertAdjacentHTML('beforeend',`<div class="chips" style="margin:4px 0 6px">${['Objectives','Module map','Assessments','Alignment'].map((c,i)=>`<span class="chip" style="animation-delay:${i*.09}s">${svg(I.target)} ${c} <span class="x">×</span></span>`).join('')}</div>`);
  await sleep(700);
  const tools=['Analyzing brief & 5 program outcomes','Drafting 5 learning objectives','Mapping 14 weekly modules','Designing 2 midterms + project','Aligning every item to objectives'];
  art.innerHTML=`<div class="sectlabel" style="margin-top:24px">Proposed course <span class="ln"></span><span class="ct">streaming…</span></div><div id="objWrap"></div>`;
  for(let i=0;i<tools.length;i++){
    const card=el(toolCard(tools[i],false)); run.appendChild(card);
    await sleep(620);
    card.querySelector('.spin')?.replaceWith(el(`<span class="chk">${svg(I.check)}</span>`));
    if(i===1){ // objectives
      const w=$('#objWrap');
      for(const [lo,desc,bl] of OBJS){ w.appendChild(el(`<div class="obj stagger" style="margin-bottom:10px"><span class="lo">${lo}</span><div class="ob"><h4>${desc}</h4><div class="bloom"><span class="pill indigo">Bloom · ${bl}</span><span class="pill agent">${svg(I.spark)} drafted</span></div></div></div>`)); await sleep(180);}
    }
    if(i===2){ // modules
      art.insertAdjacentHTML('beforeend',`<div class="sectlabel">Module map <span class="ln"></span><span class="ct">14 weeks · showing 6</span></div><div id="modWrap"></div>`);
      const w=$('#modWrap');
      for(let m=0;m<MODS.length;m++){ const [t,d,lo]=MODS[m]; w.appendChild(el(`<div class="modrow stagger" style="margin-bottom:9px"><div class="num">${m+1}</div><div class="mt"><b>${t}</b><p>${d}</p></div><span class="pill indigo">${lo}</span></div>`)); await sleep(150);}
    }
    if(i===3){
      art.insertAdjacentHTML('beforeend',`<div class="sectlabel">Assessments <span class="ln"></span></div><div class="grid3"><div class="card stagger" style="padding:14px"><b style="font-size:13.5px">Midterm 1</b><p class="muted" style="font-size:12px;margin-top:3px">Wk 7 · LO1–LO2</p></div><div class="card stagger" style="padding:14px;animation-delay:.1s"><b style="font-size:13.5px">Midterm 2</b><p class="muted" style="font-size:12px;margin-top:3px">Wk 12 · LO2–LO4</p></div><div class="card stagger" style="padding:14px;animation-delay:.2s"><b style="font-size:13.5px">Final Project</b><p class="muted" style="font-size:12px;margin-top:3px">Wk 14 · LO5</p></div></div>`);
    }
  }
  run.insertAdjacentHTML('beforeend',`<div class="reason"><details><summary>${svg('<path d="m9 6 6 6-6 6"/>')}<span class="caret"></span> Why this structure</summary><div class="rb">Front-loaded descriptive stats build intuition before inference. Hypothesis testing (LO4) spans Wks 6 & 11 because it\'s your stated emphasis and historically the hardest objective. Two midterms bracket the inference unit so you catch struggling students before the final.</div></details></div>`);
  $('#agentPanel').classList.remove('busy');$('#agentStatus').innerHTML='<span class="dot"></span> Proposal ready';
  // proposal bar
  const bar=el(`<div class="proposal-bar" id="propBar"><span class="tag">Draft · not created</span><span class="diff"><b class="add">+5</b> objectives · <b class="add">+14</b> modules · <b class="add">+3</b> assessments</span><span class="sp"></span><button class="btn ghost sm" id="regen">Regenerate</button><button class="btn ghost sm">Edit</button><button class="btn agent sm" id="approveCourse">${svg(I.check)} Approve &amp; create</button></div>`);
  art.querySelector('.sectlabel .ct').textContent='complete';
  art.insertBefore(bar,art.firstChild);
  document.querySelector('#artifact .sectlabel').scrollIntoView({behavior:'smooth',block:'start'});
  $('#approveCourse').onclick=()=>{S.authored=true;paintAuthored();};
  $('#regen').onclick=()=>{S.authedRunning=false;runAuthoring();};
  S.authedRunning=false;
}
function paintAuthored(skip){
  const bar=$('#propBar'); if(bar){bar.classList.add('published');bar.querySelector('.tag').innerHTML=svg(I.check)+' Created · published to 32 students';bar.querySelector('#approveCourse')?.remove();bar.querySelector('#regen')?.remove();}
  $('#agentStatus').innerHTML='<span class="dot"></span> Done';
}

/* ---------------- hero: coverage animation ---------------- */
function animateCoverage(){
  const ring=$('#covRing'),num=$('#covNum');if(!ring)return;
  const target=80;let t0=null;
  function step(ts){if(!t0)t0=ts;const p=Math.min((ts-t0)/1100,1);const e=1-Math.pow(1-p,3);const v=Math.round(e*target);ring.style.background=`conic-gradient(var(--amber) ${v}%, var(--surface-2) 0)`;num.textContent=v+'%';if(p<1)requestAnimationFrame(step);}
  requestAnimationFrame(step);
  document.querySelectorAll('#screen .cbar').forEach(c=>{const w=c.dataset.w;if(w)setTimeout(()=>c.querySelector('.fl').style.width=w+'%',120);});
}

renderCmd();wireChrome();render();
</script>
</body>
